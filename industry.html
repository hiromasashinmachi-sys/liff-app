<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>業種選択</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card-header {
      background: #06c755;
      color: #fff;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
    }

    .industry-list {
      list-style: none;
      padding: 8px 0;
    }

    .industry-list li {
      border-bottom: 1px solid #f0f0f0;
    }

    .industry-list li:last-child {
      border-bottom: none;
    }

    .industry-list label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      font-size: 15px;
      color: #333;
      transition: background 0.15s;
    }

    .industry-list label:active {
      background: #f5fdf7;
    }

    .industry-list input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #ccc;
      border-radius: 6px;
      flex-shrink: 0;
      position: relative;
      transition: border-color 0.15s, background 0.15s;
      cursor: pointer;
    }

    .industry-list input[type="checkbox"]:checked {
      background: #06c755;
      border-color: #06c755;
    }

    .industry-list input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 2px;
      width: 7px;
      height: 12px;
      border: 2.5px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .other-input-wrap {
      padding: 0 18px 14px;
      display: none;
    }

    .other-input-wrap.visible {
      display: block;
    }

    .other-input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      color: #333;
      outline: none;
      transition: border-color 0.15s;
    }

    .other-input:focus {
      border-color: #06c755;
    }

    .selected-count {
      text-align: center;
      font-size: 13px;
      color: #06c755;
      font-weight: 600;
      margin-bottom: 10px;
      min-height: 18px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: #06c755;
      color: #fff;
    }

    .btn-primary:disabled {
      background: #b2dfca;
      cursor: not-allowed;
      transform: none;
    }

    #loading {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
      min-height: 18px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ccc;
      border-top-color: #06c755;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #333;
      color: #fff;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 14px;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <h1>業種選択</h1>
  <p class="subtitle">あてはまる業種をすべて選択してください</p>

  <p id="loading"><span class="spinner"></span>読み込み中...</p>

  <div class="card">
    <div class="card-header">🏢 業種</div>
    <ul class="industry-list" id="industryList">
      <li>
        <label>
          <input type="checkbox" value="開発・仕入れ・買取再販" id="cb0" disabled />
          開発・仕入れ・買取再販
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox" value="建築・工事" id="cb1" disabled />
          建築・工事
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox" value="仲介（売買・賃貸）" id="cb2" disabled />
          仲介（売買・賃貸）
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox" value="管理" id="cb3" disabled />
          管理
        </label>
      </li>
      <li>
        <label>
          <input type="checkbox" value="その他" id="cb4" disabled />
          その他
        </label>
      </li>
      <li>
        <div class="other-input-wrap" id="otherInputWrap">
          <input type="text" class="other-input" id="otherText" placeholder="業種を入力してください" />
        </div>
      </li>
    </ul>
  </div>

  <p class="selected-count" id="selectedCount"></p>

  <div class="actions">
    <button class="btn btn-primary" id="sendBtn" disabled>確認中...</button>
  </div>

  <div id="toast"></div>

  <script>
    const LIFF_ID = "2009663520-TzXU0DYV";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzKbpSfhWh8_qHm_xYM3f7EjSLlSecVUb3vLNfWThJ3Yp2HxzPZEG8zjgs5MveM6dA6xQ/exec";

    const sendBtn = document.getElementById("sendBtn");
    const countEl = document.getElementById("selectedCount");
    const otherCb = document.getElementById("cb4");
    const otherInputWrap = document.getElementById("otherInputWrap");
    const otherText = document.getElementById("otherText");

    // --- 「その他」チェックでテキスト入力欄を表示 ---
    otherCb.addEventListener("change", () => {
      if (otherCb.checked) {
        otherInputWrap.classList.add("visible");
        otherText.focus();
      } else {
        otherInputWrap.classList.remove("visible");
        otherText.value = "";
      }
      updateUI();
    });

    otherText.addEventListener("input", updateUI);

    // --- チェックボックス変化 ---
    document.getElementById("industryList").addEventListener("change", e => {
      if (e.target !== otherCb) updateUI();
    });

    function getSelectedIndustries() {
      const industries = [];
      document.querySelectorAll("#industryList input[type='checkbox']:checked").forEach(cb => {
        if (cb.value === "その他") {
          const custom = otherText.value.trim();
          industries.push(custom ? `その他（${custom}）` : "その他");
        } else {
          industries.push(cb.value);
        }
      });
      return industries;
    }

    function updateUI() {
      const selected = getSelectedIndustries();
      sendBtn.disabled = selected.length === 0;
      countEl.textContent = selected.length > 0 ? `${selected.length}件 選択中` : "";
    }

    // --- LIFF 初期化 ---
    let userProfile = null;

    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) liff.login();
        return liff.getProfile();
      })
      .then(profile => {
        userProfile = profile;
        document.getElementById("loading").style.display = "none";
        document.querySelectorAll("#industryList input[type='checkbox']").forEach(cb => {
          cb.disabled = false;
        });
        sendBtn.textContent = "登録する";
        updateUI();
      })
      .catch(err => {
        showToast("初期化エラー: " + err.message);
        document.getElementById("loading").style.display = "none";
        sendBtn.textContent = "登録する";
      });

    // --- 送信 ---
    sendBtn.addEventListener("click", () => {
      const selected = getSelectedIndustries();
      if (selected.length === 0) return;

      sendBtn.disabled = true;
      sendBtn.textContent = "送信中...";

      const params = new URLSearchParams({
        action: "saveIndustry",
        userId: userProfile ? userProfile.userId : "",
        name:   userProfile ? userProfile.displayName : "不明",
        industries: selected.join(",")
      });

      fetch(GAS_URL + "?" + params.toString(), {
        method: "GET",
        mode: "no-cors"
      }).then(() => {
        showToast("登録しました！");
        setTimeout(() => liff.closeWindow(), 1500);
      }).catch(err => {
        showToast("送信に失敗しました: " + err.message);
        sendBtn.disabled = false;
        sendBtn.textContent = "登録する";
      });
    });

    // --- トースト ---
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }
  </script>
</body>
</html>

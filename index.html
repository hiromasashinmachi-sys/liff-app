<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日程登録</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card-header {
      background: #06c755;
      color: #fff;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
    }

    .schedule-list {
      list-style: none;
      padding: 8px 0;
    }

    .schedule-list li {
      border-bottom: 1px solid #f0f0f0;
    }

    .schedule-list li:last-child {
      border-bottom: none;
    }

    .schedule-list label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      font-size: 15px;
      color: #333;
      transition: background 0.15s;
    }

    .schedule-list label:active {
      background: #f5fdf7;
    }

    .schedule-list input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #ccc;
      border-radius: 6px;
      flex-shrink: 0;
      position: relative;
      transition: border-color 0.15s, background 0.15s;
      cursor: pointer;
    }

    .schedule-list input[type="checkbox"]:checked {
      background: #06c755;
      border-color: #06c755;
    }

    .schedule-list input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 2px;
      width: 7px;
      height: 12px;
      border: 2.5px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .date-text {
      flex: 1;
    }

    .date-main {
      font-weight: 600;
      font-size: 15px;
    }

    .date-sub {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    .full-badge {
      font-size: 12px;
      font-weight: 700;
      color: #e53935;
      margin-left: 4px;
      white-space: nowrap;
    }

    .registered-badge {
      font-size: 12px;
      font-weight: 700;
      color: #e53935;
      margin-left: 4px;
      white-space: nowrap;
    }

    .schedule-list li.is-full label,
    .schedule-list li.is-registered label {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: #06c755;
      color: #fff;
    }

    .btn-primary:disabled {
      background: #b2dfca;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #555;
      font-size: 14px;
      font-weight: 600;
    }

    .selected-count {
      text-align: center;
      font-size: 13px;
      color: #06c755;
      font-weight: 600;
      margin-bottom: 10px;
      min-height: 18px;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #333;
      color: #fff;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 14px;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #loading {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
      min-height: 18px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ccc;
      border-top-color: #06c755;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .schedule-list input[type="checkbox"]:disabled {
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <h1>日程登録</h1>
  <p class="subtitle">参加できる日程を選んでください</p>

  <div class="card">
    <div class="card-header">📅 2026年4月 スケジュール</div>
    <ul class="schedule-list" id="scheduleList"></ul>
  </div>

  <p class="selected-count" id="selectedCount"></p>
  <p id="loading"><span class="spinner"></span>空き状況を確認中...</p>

  <div class="actions">
    <button class="btn btn-primary" id="sendBtn" disabled>確認中...</button>
    <button class="btn btn-secondary" id="clearBtn">選択をリセット</button>
  </div>

  <div id="toast"></div>

  <script>
    // ============================================================
    // 日程データ（毎月ここだけ変更する）
    // format: { date, time, place, mapUrl }
    // ============================================================
    const SCHEDULES = [
      { date: "4月3日（金）",  time: "17:00〜18:30", place: "かっぱ寿司", mapUrl: "https://maps.app.goo.gl/xJwDvHiy4ErHVyzG6" },
      { date: "4月4日（土）",  time: "17:00〜18:30", place: "かっぱ寿司", mapUrl: "https://maps.app.goo.gl/xJwDvHiy4ErHVyzG6" },
      { date: "4月7日（火）",  time: "17:00〜18:30", place: "かっぱ寿司", mapUrl: "https://maps.app.goo.gl/xJwDvHiy4ErHVyzG6" },
      { date: "4月9日（木）",  time: "17:00〜18:30", place: "かっぱ寿司", mapUrl: "https://maps.app.goo.gl/xJwDvHiy4ErHVyzG6" },
      { date: "4月11日（土）", time: "17:00〜18:30", place: "かっぱ寿司", mapUrl: "https://maps.app.goo.gl/xJwDvHiy4ErHVyzG6" },
      { date: "4月16日（木）", time: "17:00〜18:30", place: "かっぱ寿司", mapUrl: "https://maps.app.goo.gl/xJwDvHiy4ErHVyzG6" },
      { date: "4月18日（土）", time: "17:00〜18:30", place: "かっぱ寿司", mapUrl: "https://maps.app.goo.gl/xJwDvHiy4ErHVyzG6" },
      { date: "4月19日（日）", time: "17:00〜18:30", place: "かっぱ寿司", mapUrl: "https://maps.app.goo.gl/xJwDvHiy4ErHVyzG6" },
      { date: "4月20日（月）", time: "17:00〜18:30", place: "かっぱ寿司", mapUrl: "https://maps.app.goo.gl/xJwDvHiy4ErHVyzG6" },
    ];
    // ============================================================

    const LIFF_ID = "2009663520-xpTgeC9p";

    // --- DOM 構築 ---
    const list = document.getElementById("scheduleList");
    SCHEDULES.forEach((s, i) => {
      const li = document.createElement("li");
      li.dataset.index = i;
      li.innerHTML = `
        <label>
          <input type="checkbox" value="${i}" disabled />
          <span class="date-text">
            <span class="date-main">${s.date}<span class="full-badge" id="badge-${i}" style="display:none">満員</span><span class="registered-badge" id="reg-badge-${i}" style="display:none">✅ 登録済み</span></span>
            <span class="date-sub">${s.time}　<a href="${s.mapUrl}" target="_blank" rel="noopener" style="color:#06c755;text-decoration:none;">📍${s.place}</a></span>
          </span>
        </label>`;
      list.appendChild(li);
    });

    // --- 満員・登録済み表示を適用・ロード完了処理 ---
    function applyCapacity(counts, registeredDates) {
      SCHEDULES.forEach((s, i) => {
        const li = list.querySelector(`li[data-index="${i}"]`);
        const cb = li.querySelector("input");
        const count = counts[s.date] || 0;
        if (registeredDates.includes(s.date)) {
          li.classList.add("is-registered");
          cb.disabled = true;
          document.getElementById(`reg-badge-${i}`).style.display = "inline";
        } else if (count >= 30) {
          li.classList.add("is-full");
          cb.disabled = true;
          document.getElementById(`badge-${i}`).style.display = "inline";
        } else {
          cb.disabled = false;
        }
      });
      document.getElementById("loading").style.display = "none";
      sendBtn.textContent = "登録する";
      updateUI();
    }

    // --- チェックボックス変化 ---
    const sendBtn = document.getElementById("sendBtn");
    const countEl = document.getElementById("selectedCount");

    list.addEventListener("change", updateUI);

    function getChecked() {
      return [...document.querySelectorAll("#scheduleList input:checked")]
        .filter(cb => !cb.disabled)
        .map(cb => SCHEDULES[parseInt(cb.value)]);
    }

    function updateUI() {
      const checked = getChecked();
      sendBtn.disabled = checked.length === 0;
      countEl.textContent = checked.length > 0
        ? `${checked.length}件 選択中`
        : "";
    }

    // --- リセット ---
    document.getElementById("clearBtn").addEventListener("click", () => {
      document.querySelectorAll("#scheduleList input").forEach(cb => cb.checked = false);
      updateUI();
    });

    const GAS_URL = "https://script.google.com/macros/s/AKfycbzKbpSfhWh8_qHm_xYM3f7EjSLlSecVUb3vLNfWThJ3Yp2HxzPZEG8zjgs5MveM6dA6xQ/exec";

    // --- LIFF 初期化 & 参加者数・登録済み日程取得 ---
    let _userId = null;

    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) liff.login();
        return liff.getProfile();
      })
      .then(profile => {
        _userId = profile.userId;
        const regParams = new URLSearchParams({
          action: "getRegistrations",
          userId: profile.userId
        });
        return Promise.all([
          fetch(GAS_URL).then(r => r.json()),
          fetch(GAS_URL + "?" + regParams.toString()).then(r => r.json())
        ]);
      })
      .then(([countData, regData]) => {
        const registeredDates = (regData.schedules || []).map(s => s.date);
        applyCapacity(countData.counts || {}, registeredDates);
      })
      .catch(err => {
        showToast("初期化エラー: " + err.message);
        applyCapacity({}, []);
      });

    // --- 送信 ---
    sendBtn.addEventListener("click", async () => {
      const selected = getChecked();
      if (selected.length === 0) return;

      sendBtn.disabled = true;
      sendBtn.textContent = "送信中...";

      // LIFFプロフィール取得
      let profile = { displayName: "不明", userId: _userId || "" };
      try {
        profile = await liff.getProfile();
      } catch (e) {
        // プロフィール取得失敗時はそのまま続行
      }

      const params = new URLSearchParams({
        name: profile.displayName,
        userId: profile.userId,
        dates:   selected.map(s => s.date).join(","),
        times:   selected.map(s => s.time).join(","),
        places:  selected.map(s => s.place).join(","),
        mapUrls: selected.map(s => s.mapUrl).join(",")
      });

      fetch(GAS_URL + "?" + params.toString(), {
        method: "GET",
        mode: "no-cors"
      }).then(() => {
        showToast("登録しました！");
        setTimeout(() => liff.closeWindow(), 1500);
      }).catch(err => {
        showToast("送信に失敗しました: " + err.message);
        sendBtn.disabled = false;
        sendBtn.textContent = "登録する";
      });
    });

    // --- トースト ---
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }
  </script>
</body>
</html>

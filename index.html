<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>日程登録</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card-header {
      background: #06c755;
      color: #fff;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
    }

    .schedule-list {
      list-style: none;
      padding: 8px 0;
    }

    .schedule-list li {
      border-bottom: 1px solid #f0f0f0;
    }

    .schedule-list li:last-child {
      border-bottom: none;
    }

    .schedule-list label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      font-size: 15px;
      color: #333;
      transition: background 0.15s;
    }

    .schedule-list label:active {
      background: #f5fdf7;
    }

    .schedule-list input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #ccc;
      border-radius: 6px;
      flex-shrink: 0;
      position: relative;
      transition: border-color 0.15s, background 0.15s;
      cursor: pointer;
    }

    .schedule-list input[type="checkbox"]:checked {
      background: #06c755;
      border-color: #06c755;
    }

    .schedule-list input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 2px;
      width: 7px;
      height: 12px;
      border: 2.5px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .date-text {
      flex: 1;
    }

    .date-main {
      font-weight: 600;
      font-size: 15px;
    }

    .date-sub {
      font-size: 12px;
      color: #888;
      margin-top: 2px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: #06c755;
      color: #fff;
    }

    .btn-primary:disabled {
      background: #b2dfca;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #555;
      font-size: 14px;
      font-weight: 600;
    }

    .selected-count {
      text-align: center;
      font-size: 13px;
      color: #06c755;
      font-weight: 600;
      margin-bottom: 10px;
      min-height: 18px;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #333;
      color: #fff;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 14px;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <h1>日程登録</h1>
  <p class="subtitle">参加できる日程を選んでください</p>

  <div class="card">
    <div class="card-header">📅 2026年4月 スケジュール</div>
    <ul class="schedule-list" id="scheduleList"></ul>
  </div>

  <p class="selected-count" id="selectedCount"></p>

  <div class="actions">
    <button class="btn btn-primary" id="sendBtn" disabled>登録する</button>
    <button class="btn btn-secondary" id="clearBtn">選択をリセット</button>
  </div>

  <div id="toast"></div>

  <script>
    // ============================================================
    // 日程データ（毎月ここだけ変更する）
    // format: { date: "表示用の日付", label: "補足テキスト（省略可）" }
    // ============================================================
    const SCHEDULES = [
      { date: "4月5日（日）", label: "13:00〜15:00" },
      { date: "4月12日（日）", label: "10:00〜12:00" },
      { date: "4月19日（日）", label: "14:00〜16:00" },
      { date: "4月23日（木）", label: "19:00〜21:00" },
      { date: "4月26日（日）", label: "10:00〜12:00" },
    ];
    // ============================================================

    const LIFF_ID = "2009663520-xpTgeC9p";

    // --- DOM 構築 ---
    const list = document.getElementById("scheduleList");
    SCHEDULES.forEach((s, i) => {
      const li = document.createElement("li");
      li.innerHTML = `
        <label>
          <input type="checkbox" value="${i}" />
          <span class="date-text">
            <span class="date-main">${s.date}</span>
            ${s.label ? `<span class="date-sub">${s.label}</span>` : ""}
          </span>
        </label>`;
      list.appendChild(li);
    });

    // --- チェックボックス変化 ---
    const sendBtn = document.getElementById("sendBtn");
    const countEl = document.getElementById("selectedCount");

    list.addEventListener("change", updateUI);

    function getChecked() {
      return [...document.querySelectorAll("#scheduleList input:checked")]
        .map(cb => SCHEDULES[parseInt(cb.value)]);
    }

    function updateUI() {
      const checked = getChecked();
      sendBtn.disabled = checked.length === 0;
      countEl.textContent = checked.length > 0
        ? `${checked.length}件 選択中`
        : "";
    }

    // --- リセット ---
    document.getElementById("clearBtn").addEventListener("click", () => {
      document.querySelectorAll("#scheduleList input").forEach(cb => cb.checked = false);
      updateUI();
    });

    const GAS_URL = "https://script.google.com/macros/s/AKfycbzKbpSfhWh8_qHm_xYM3f7EjSLlSecVUb3vLNfWThJ3Yp2HxzPZEG8zjgs5MveM6dA6xQ/exec";

    // --- LIFF 初期化 ---
    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) liff.login();
      })
      .catch(err => showToast("LIFF初期化エラー: " + err.message));

    // --- 送信 ---
    sendBtn.addEventListener("click", async () => {
      const selected = getChecked();
      if (selected.length === 0) return;

      sendBtn.disabled = true;
      sendBtn.textContent = "送信中...";

      // LIFFプロフィール取得
      let name = "不明";
      try {
        const profile = await liff.getProfile();
        name = profile.displayName;
      } catch (e) {
        // プロフィール取得失敗時はそのまま続行
      }

      const dates = selected.map(s => s.label ? `${s.date} ${s.label}` : s.date);

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ name, dates }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        showToast("登録しました！");
        setTimeout(() => liff.closeWindow(), 1500);
      } catch (err) {
        showToast("送信に失敗しました: " + err.message);
        sendBtn.disabled = false;
        sendBtn.textContent = "登録する";
      }
    });

    // --- トースト ---
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }
  </script>
</body>
</html>

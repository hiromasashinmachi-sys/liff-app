<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>領収書発行</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card-header {
      background: #06c755;
      color: #fff;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
    }

    .card-body {
      padding: 20px 18px;
    }

    /* 日程チェックボックスリスト */
    .date-list {
      list-style: none;
      padding: 8px 0;
    }

    .date-list li {
      border-bottom: 1px solid #f0f0f0;
    }

    .date-list li:last-child {
      border-bottom: none;
    }

    .date-list label {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      cursor: pointer;
      font-size: 15px;
      color: #333;
      transition: background 0.15s;
    }

    .date-list label:active {
      background: #f5fdf7;
    }

    .date-list li.is-issued label {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .date-list input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #ccc;
      border-radius: 6px;
      flex-shrink: 0;
      position: relative;
      transition: border-color 0.15s, background 0.15s;
      cursor: pointer;
    }

    .date-list input[type="checkbox"]:checked {
      background: #06c755;
      border-color: #06c755;
    }

    .date-list input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 2px;
      width: 7px;
      height: 12px;
      border: 2.5px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .date-list input[type="checkbox"]:disabled {
      cursor: not-allowed;
      background: #eee;
      border-color: #ddd;
    }

    .date-text {
      flex: 1;
    }

    .date-main {
      font-weight: 600;
      font-size: 15px;
    }

    .issued-badge {
      font-size: 12px;
      font-weight: 700;
      color: #e53935;
      margin-left: 6px;
      white-space: nowrap;
    }

    /* 会社名フォーム */
    .form-group {
      margin-bottom: 0;
    }

    .form-label {
      display: block;
      font-size: 13px;
      color: #555;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      color: #333;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input:focus {
      border-color: #06c755;
    }

    .form-input::placeholder {
      color: #bbb;
    }

    /* ボタン */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: #06c755;
      color: #fff;
    }

    .btn-primary:disabled {
      background: #b2dfca;
      cursor: not-allowed;
      transform: none;
    }

    /* 参加登録なし */
    .empty-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 18px;
      gap: 10px;
    }

    .empty-icon {
      font-size: 44px;
    }

    .empty-text {
      font-size: 15px;
      font-weight: 700;
      color: #333;
    }

    .empty-sub {
      font-size: 13px;
      color: #888;
      text-align: center;
    }

    /* 選択件数 */
    .selected-count {
      text-align: center;
      font-size: 13px;
      color: #06c755;
      font-weight: 600;
      margin-bottom: 10px;
      min-height: 18px;
    }

    /* トースト */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #333;
      color: #fff;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 14px;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #loading {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
      min-height: 18px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ccc;
      border-top-color: #06c755;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .date-notice {
      font-size: 12px;
      color: #e53935;
      margin-bottom: 14px;
    }

    #mainContent {
      display: none;
    }

    #companyCard {
      display: none;
    }
  </style>
</head>
<body>

  <h1>領収書発行</h1>
  <p class="subtitle">Light交流会</p>

  <p id="loading"><span class="spinner"></span>確認中...</p>

  <div id="mainContent">

    <!-- 参加登録なし -->
    <div id="emptyView" class="card" style="display:none;">
      <div class="card-header">🧾 領収書発行</div>
      <div class="empty-box">
        <div class="empty-icon">📋</div>
        <div class="empty-text">参加登録が確認できません</div>
        <div class="empty-sub">参加登録が完了していないため<br>領収書を発行できません。</div>
      </div>
    </div>

    <!-- 日程選択 -->
    <div id="formView" style="display:none;">
      <div class="card">
        <div class="card-header">📅 日程を選択してください</div>
        <ul class="date-list" id="dateList"></ul>
      </div>

      <!-- 注意文 -->
      <p class="date-notice">※領収書は参加当日18時以降に発行可能になります</p>

      <!-- 会社名入力（日程選択後に表示） -->
      <div class="card" id="companyCard">
        <div class="card-header">✏️ 宛名を入力</div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label" for="companyName">会社名・お名前</label>
            <input
              type="text"
              id="companyName"
              class="form-input"
              placeholder="例：株式会社〇〇"
              maxlength="50"
            />
          </div>
        </div>
      </div>

      <p class="selected-count" id="selectedCount"></p>

      <div class="actions">
        <button class="btn btn-primary" id="issueBtn" disabled>発行する</button>
      </div>
    </div>

  </div>

  <div id="toast"></div>

  <script>
    const LIFF_ID = "2009663520-v8w3ZFCF";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzKbpSfhWh8_qHm_xYM3f7EjSLlSecVUb3vLNfWThJ3Yp2HxzPZEG8zjgs5MveM6dA6xQ/exec";

    let _userId = null;
    let _userName = null;

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // 領収書HTML生成（1通分）
    function generateReceiptHTML(companyName, eventDate, issueDate) {
      return `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>領収書</title>
  <style>
    @media print {
      body { margin: 0; }
      .no-print { display: none; }
    }
    body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif;
      background: #fff;
      color: #111;
      padding: 40px 60px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 32px;
      letter-spacing: 16px;
      margin-bottom: 30px;
      border-bottom: 3px double #111;
      padding-bottom: 16px;
    }
    .issue-date {
      text-align: right;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .addressee-label {
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
    }
    .addressee {
      font-size: 22px;
      font-weight: 700;
      border-bottom: 2px solid #111;
      padding-bottom: 4px;
      margin-bottom: 24px;
      display: inline-block;
      min-width: 260px;
    }
    .amount-section {
      text-align: center;
      margin: 28px 0;
      padding: 18px;
      border: 2px solid #111;
    }
    .amount-label {
      font-size: 14px;
      margin-bottom: 8px;
      letter-spacing: 4px;
    }
    .amount {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .amount-note {
      font-size: 13px;
      color: #555;
      margin-top: 6px;
    }
    .detail-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 32px;
      font-size: 14px;
    }
    .detail-table th, .detail-table td {
      border: 1px solid #ccc;
      padding: 10px 14px;
    }
    .detail-table th {
      background: #f5f5f5;
      font-weight: 600;
      width: 30%;
    }
    .issuer-section {
      text-align: right;
      margin-top: 16px;
      font-size: 15px;
      line-height: 2;
    }
    .issuer-name {
      font-size: 20px;
      font-weight: 700;
    }
    .stamp-area {
      display: inline-block;
      width: 70px;
      height: 70px;
      border: 2px solid #c00;
      border-radius: 50%;
      color: #c00;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      line-height: 70px;
      margin-left: 16px;
      vertical-align: middle;
    }
    .print-btn {
      display: block;
      width: 100%;
      max-width: 200px;
      margin: 32px auto 0;
      padding: 12px;
      background: #06c755;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>領　収　書</h1>
  <div class="issue-date">発行日：${issueDate}</div>

  <div class="addressee-label">宛名</div>
  <div class="addressee">${escapeHtml(companyName)}&nbsp;御中</div>

  <div class="amount-section">
    <div class="amount-label">金　額</div>
    <div class="amount">¥3,000</div>
    <div class="amount-note">（税込）</div>
  </div>

  <table class="detail-table">
    <tr>
      <th>但し書き</th>
      <td>交流会参加費として</td>
    </tr>
    <tr>
      <th>参加日</th>
      <td>${escapeHtml(eventDate)}</td>
    </tr>
    <tr>
      <th>発行者</th>
      <td>Light交流会</td>
    </tr>
  </table>

  <div class="issuer-section">
    <div class="issuer-name">Light交流会<span class="stamp-area">印</span></div>
  </div>

  <button class="print-btn no-print" onclick="window.print()">印刷 / PDF保存</button>
</body>
</html>`;
    }

    // 1ファイルダウンロード
    function downloadReceiptFile(companyName, eventDate, issueDate) {
      const html = generateReceiptHTML(companyName, eventDate, issueDate);
      const blob = new Blob([html], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `領収書_${companyName}_${eventDate}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 複数ファイルを順番にダウンロード
    async function downloadAll(companyName, dates) {
      const issueDate = getTodayStr();
      for (let i = 0; i < dates.length; i++) {
        if (i > 0) await new Promise(r => setTimeout(r, 400));
        downloadReceiptFile(companyName, dates[i], issueDate);
      }
    }

    // UI更新
    const issueBtn = document.getElementById("issueBtn");
    const companyInput = document.getElementById("companyName");
    const companyCard = document.getElementById("companyCard");
    const countEl = document.getElementById("selectedCount");
    const dateList = document.getElementById("dateList");

    function getSelectedDates() {
      return [...dateList.querySelectorAll("input[type='checkbox']:checked:not(:disabled)")]
        .map(cb => cb.value);
    }

    function updateUI() {
      const selected = getSelectedDates();
      const company = companyInput.value.trim();

      if (selected.length > 0) {
        companyCard.style.display = "block";
        countEl.textContent = `${selected.length}件 選択中`;
      } else {
        companyCard.style.display = "none";
        countEl.textContent = "";
      }

      issueBtn.disabled = selected.length === 0 || company === "";
    }

    dateList.addEventListener("change", updateUI);
    companyInput.addEventListener("input", updateUI);

    // 日程文字列（例: "4月26日（日）"）が当日18時以降かどうか判定
    function isAvailableToIssue(dateStr) {
      const match = dateStr.match(/(\d+)月(\d+)日/);
      if (!match) return true; // パース失敗時は通す
      const month = parseInt(match[1], 10);
      const day = parseInt(match[2], 10);
      const eventDate = new Date(2026, month - 1, day, 18, 0, 0);
      return new Date() >= eventDate;
    }

    // 発行ボタン
    issueBtn.addEventListener("click", async () => {
      const selectedDates = getSelectedDates();
      const companyName = companyInput.value.trim();
      if (selectedDates.length === 0 || !companyName) return;

      // ②当日18時以降チェック
      const notYetAvailable = selectedDates.filter(d => !isAvailableToIssue(d));
      if (notYetAvailable.length > 0) {
        alert(`以下の日程はまだ発行できません。\n参加当日18時以降に再度お試しください。\n\n${notYetAvailable.join("\n")}`);
        return;
      }

      // ③ボタンを「作成中」状態に
      issueBtn.disabled = true;
      issueBtn.textContent = "作成中です。少々お待ちください...";

      try {
        // 領収書ダウンロード
        await downloadAll(companyName, selectedDates);

        // GASに発行済みフラグを記録
        const params = new URLSearchParams({
          action: "issueReceipt",
          userId: _userId,
          userName: _userName,
          companyName: companyName,
          dates: selectedDates.join(",")
        });
        const issueRes = await fetch(GAS_URL + "?" + params.toString(), {
          method: "GET",
          mode: "cors"
        });
        const issueData = await issueRes.json();
        console.log("issueReceipt response:", issueData);

        // 発行した日程を「発行済み」に更新
        selectedDates.forEach(date => markAsIssued(date));
        companyCard.style.display = "none";
        countEl.textContent = "";
        companyInput.value = "";
        issueBtn.textContent = "発行する";
        showToast(`${selectedDates.length}件の領収書を発行しました`);
      } catch (err) {
        showToast("エラーが発生しました: " + err.message);
        issueBtn.disabled = false;
        issueBtn.textContent = "発行する";
      }
    });

    // チェックボックスを「発行済み」にする
    function markAsIssued(date) {
      const cb = dateList.querySelector(`input[value="${CSS.escape(date)}"]`);
      if (!cb) return;
      const li = cb.closest("li");
      cb.checked = false;
      cb.disabled = true;
      li.classList.add("is-issued");
      const badge = li.querySelector(".issued-badge");
      if (badge) badge.style.display = "inline";
    }

    // 日程リスト描画
    function renderDateList(registeredDates, issuedDates) {
      dateList.innerHTML = "";
      registeredDates.forEach(date => {
        const isIssued = issuedDates.includes(date);
        const li = document.createElement("li");
        if (isIssued) li.classList.add("is-issued");
        li.innerHTML = `
          <label>
            <input type="checkbox" value="${escapeHtml(date)}" ${isIssued ? "disabled" : ""} />
            <span class="date-text">
              <span class="date-main">${escapeHtml(date)}<span class="issued-badge" style="display:${isIssued ? "inline" : "none"}">発行済み</span></span>
            </span>
          </label>`;
        dateList.appendChild(li);
      });
    }

    // LIFF初期化
    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) liff.login();
        return liff.getProfile();
      })
      .then(profile => {
        _userId = profile.userId;
        _userName = profile.displayName;
        const params = new URLSearchParams({
          action: "getReceiptInfo",
          userId: profile.userId
        });
        return fetch(GAS_URL + "?" + params.toString()).then(r => r.json());
      })
      .then(data => {
        document.getElementById("loading").style.display = "none";
        document.getElementById("mainContent").style.display = "block";

        const registeredDates = data.registeredDates || [];
        const issuedDates = data.issuedDates || [];

        if (registeredDates.length === 0) {
          document.getElementById("emptyView").style.display = "block";
        } else {
          renderDateList(registeredDates, issuedDates);
          document.getElementById("formView").style.display = "block";
        }
      })
      .catch(err => {
        document.getElementById("loading").style.display = "none";
        showToast("初期化エラー: " + err.message);
      });

    // トースト
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }
  </script>
</body>
</html>

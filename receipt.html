<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>領収書発行</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin-bottom: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card-header {
      background: #06c755;
      color: #fff;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
    }

    .card-body {
      padding: 20px 18px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
      color: #333;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #888;
      font-size: 13px;
      flex-shrink: 0;
      margin-right: 12px;
    }

    .info-value {
      font-weight: 600;
      text-align: right;
    }

    .amount-value {
      font-size: 20px;
      font-weight: 700;
      color: #06c755;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      color: #555;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      color: #333;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input:focus {
      border-color: #06c755;
    }

    .form-input::placeholder {
      color: #bbb;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: #06c755;
      color: #fff;
    }

    .btn-primary:disabled {
      background: #b2dfca;
      cursor: not-allowed;
      transform: none;
    }

    .issued-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 18px;
      gap: 10px;
    }

    .issued-icon {
      font-size: 48px;
    }

    .issued-text {
      font-size: 16px;
      font-weight: 700;
      color: #333;
    }

    .issued-sub {
      font-size: 13px;
      color: #888;
      text-align: center;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #333;
      color: #fff;
      padding: 10px 22px;
      border-radius: 24px;
      font-size: 14px;
      opacity: 0;
      transition: transform 0.3s, opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    #loading {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
      min-height: 18px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid #ccc;
      border-top-color: #06c755;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #mainContent {
      display: none;
    }
  </style>
</head>
<body>

  <h1>領収書発行</h1>
  <p class="subtitle">Light交流会</p>

  <p id="loading"><span class="spinner"></span>確認中...</p>

  <div id="mainContent">
    <!-- 発行済みの場合 -->
    <div id="issuedView" class="card" style="display:none;">
      <div class="card-header">🧾 領収書</div>
      <div class="issued-box">
        <div class="issued-icon">✅</div>
        <div class="issued-text">領収書は発行済みです</div>
        <div class="issued-sub">領収書はすでに発行されています。<br>再発行はできません。</div>
      </div>
    </div>

    <!-- 未発行の場合：領収書内容確認＋会社名入力 -->
    <div id="formView" style="display:none;">
      <div class="card">
        <div class="card-header">🧾 領収書の内容</div>
        <div class="card-body">
          <div class="info-row">
            <span class="info-label">発行者</span>
            <span class="info-value">Light交流会</span>
          </div>
          <div class="info-row">
            <span class="info-label">但し書き</span>
            <span class="info-value">交流会参加費として</span>
          </div>
          <div class="info-row">
            <span class="info-label">金額</span>
            <span class="info-value amount-value">¥3,000（税込）</span>
          </div>
          <div class="info-row">
            <span class="info-label">発行日</span>
            <span class="info-value" id="issueDateDisplay"></span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">✏️ 宛名を入力</div>
        <div class="card-body">
          <div class="form-group">
            <label class="form-label" for="companyName">会社名・お名前</label>
            <input
              type="text"
              id="companyName"
              class="form-input"
              placeholder="例：株式会社〇〇"
              maxlength="50"
            />
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="issueBtn" disabled>発行する</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const LIFF_ID = "2009663520-v8w3ZFCF";
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzKbpSfhWh8_qHm_xYM3f7EjSLlSecVUb3vLNfWThJ3Yp2HxzPZEG8zjgs5MveM6dA6xQ/exec";

    let _userId = null;
    let _userName = null;

    // 発行日の表示
    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
    }

    document.getElementById("issueDateDisplay").textContent = getTodayStr();

    // 会社名入力でボタン活性化
    const companyInput = document.getElementById("companyName");
    const issueBtn = document.getElementById("issueBtn");

    companyInput.addEventListener("input", () => {
      issueBtn.disabled = companyInput.value.trim() === "";
    });

    // 発行済みチェック後の画面切り替え
    function showIssuedView() {
      document.getElementById("issuedView").style.display = "block";
      document.getElementById("formView").style.display = "none";
      document.getElementById("mainContent").style.display = "block";
    }

    function showFormView() {
      document.getElementById("issuedView").style.display = "none";
      document.getElementById("formView").style.display = "block";
      document.getElementById("mainContent").style.display = "block";
    }

    // 領収書HTMLを生成
    function generateReceiptHTML(companyName, issueDate) {
      return `<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>領収書</title>
  <style>
    @media print {
      body { margin: 0; }
      .no-print { display: none; }
    }
    body {
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif;
      background: #fff;
      color: #111;
      margin: 0;
      padding: 40px 60px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      font-size: 32px;
      letter-spacing: 16px;
      margin-bottom: 30px;
      border-bottom: 3px double #111;
      padding-bottom: 16px;
    }
    .issue-date {
      text-align: right;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .addressee {
      font-size: 22px;
      font-weight: 700;
      border-bottom: 2px solid #111;
      padding-bottom: 4px;
      margin-bottom: 24px;
      display: inline-block;
      min-width: 260px;
    }
    .addressee-label {
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
    }
    .amount-section {
      text-align: center;
      margin: 28px 0;
      padding: 18px;
      border: 2px solid #111;
    }
    .amount-label {
      font-size: 14px;
      margin-bottom: 8px;
      letter-spacing: 4px;
    }
    .amount {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .amount-note {
      font-size: 13px;
      color: #555;
      margin-top: 6px;
    }
    .detail-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 32px;
      font-size: 14px;
    }
    .detail-table th, .detail-table td {
      border: 1px solid #ccc;
      padding: 10px 14px;
    }
    .detail-table th {
      background: #f5f5f5;
      font-weight: 600;
      width: 30%;
    }
    .issuer-section {
      text-align: right;
      margin-top: 16px;
      font-size: 15px;
      line-height: 2;
    }
    .issuer-name {
      font-size: 20px;
      font-weight: 700;
    }
    .stamp-area {
      display: inline-block;
      width: 70px;
      height: 70px;
      border: 2px solid #c00;
      border-radius: 50%;
      color: #c00;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      line-height: 70px;
      margin-left: 16px;
      vertical-align: middle;
    }
    .print-btn {
      display: block;
      width: 100%;
      max-width: 200px;
      margin: 32px auto 0;
      padding: 12px;
      background: #06c755;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>領　収　書</h1>
  <div class="issue-date">発行日：${issueDate}</div>

  <div class="addressee-label">宛名</div>
  <div class="addressee">${escapeHtml(companyName)}&nbsp;御中</div>

  <div class="amount-section">
    <div class="amount-label">金　額</div>
    <div class="amount">¥3,000</div>
    <div class="amount-note">（税込）</div>
  </div>

  <table class="detail-table">
    <tr>
      <th>但し書き</th>
      <td>交流会参加費として</td>
    </tr>
    <tr>
      <th>発行者</th>
      <td>Light交流会</td>
    </tr>
  </table>

  <div class="issuer-section">
    <div class="issuer-name">Light交流会<span class="stamp-area">印</span></div>
  </div>

  <button class="print-btn no-print" onclick="window.print()">印刷 / PDF保存</button>
</body>
</html>`;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // 領収書ダウンロード
    function downloadReceipt(companyName) {
      const issueDate = getTodayStr();
      const html = generateReceiptHTML(companyName, issueDate);
      const blob = new Blob([html], { type: "text/html;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `領収書_${companyName}_${issueDate}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 発行ボタン
    issueBtn.addEventListener("click", async () => {
      const companyName = companyInput.value.trim();
      if (!companyName) return;

      issueBtn.disabled = true;
      issueBtn.textContent = "発行中...";

      try {
        // 領収書ダウンロード
        downloadReceipt(companyName);

        // GASに発行済みフラグを記録（no-corsで送信）
        const params = new URLSearchParams({
          action: "issueReceipt",
          userId: _userId,
          userName: _userName,
          companyName: companyName
        });
        await fetch(GAS_URL + "?" + params.toString(), {
          method: "GET",
          mode: "no-cors"
        });

        showToast("領収書を発行しました");
        setTimeout(() => showIssuedView(), 1200);
      } catch (err) {
        showToast("エラーが発生しました: " + err.message);
        issueBtn.disabled = false;
        issueBtn.textContent = "発行する";
      }
    });

    // LIFF初期化 → 発行済みチェック
    liff.init({ liffId: LIFF_ID })
      .then(() => {
        if (!liff.isLoggedIn()) liff.login();
        return liff.getProfile();
      })
      .then(profile => {
        _userId = profile.userId;
        _userName = profile.displayName;

        const params = new URLSearchParams({
          action: "checkReceipt",
          userId: profile.userId
        });
        return fetch(GAS_URL + "?" + params.toString()).then(r => r.json());
      })
      .then(data => {
        document.getElementById("loading").style.display = "none";
        if (data.issued) {
          showIssuedView();
        } else {
          showFormView();
        }
      })
      .catch(err => {
        document.getElementById("loading").style.display = "none";
        showToast("初期化エラー: " + err.message);
        // エラー時もフォームを表示（GAS側でフラグ管理できる）
        showFormView();
      });

    // トースト
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }
  </script>
</body>
</html>
